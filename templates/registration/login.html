{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-shell"><div class="auth-card">
  <div class="text-center mb-4"><div class="brand-mark brand-mark-lg mx-auto mb-3"><i class="bi bi-wallet2"></i></div><h1 class="h3 fw-bold">Welcome back</h1><p class="text-muted">Sign in to manage your money with confidence.</p></div>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Your username or password was not recognised.</div>{% endif %}
    <div class="mb-3"><label class="form-label">Username</label><input class="form-control form-control-lg" name="username" required autofocus></div>
    <div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" required></div>
    <button class="btn btn-primary btn-lg w-100 mt-2">Sign in</button>
  </form><p class="text-center text-muted mt-4 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div></div>
{% endblock %}
