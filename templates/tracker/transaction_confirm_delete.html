{% extends "base.html" %}{% block title %}Delete transaction{% endblock %}{% block content %}<div class="form-page"><section class="panel"><div class="text-danger fs-2 mb-2"><i class="bi bi-exclamation-triangle"></i></div><h1 class="h4 fw-bold">Delete this transaction?</h1><p class="text-muted">Delete <strong>{{ transaction.title }}</strong> (KSh {{ transaction.amount|floatformat:2 }})? This cannot be undone.</p><form method="post">{% csrf_token %}<button class="btn btn-danger">Yes, delete</button> <a class="btn btn-light" href="{% url 'transactions' %}">Keep transaction</a></form></section></div>{% endblock %}
